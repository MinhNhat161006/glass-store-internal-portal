<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OptiVision - Cổng Vận Hành Nội Bộ</title>
    <!-- Plus Jakarta Sans Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet" />
    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <!-- Tailwind CDN with OptiVision Design Tokens -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#004967",
              "primary-container": "#086288",
              "on-primary": "#ffffff",
              "primary-fixed": "#c6e7ff",
              "primary-fixed-dim": "#8bcef9",
              "secondary": "#19648f",
              "secondary-container": "#8fcdfd",
              "on-secondary": "#ffffff",
              "on-secondary-container": "#005881",
              "tertiary": "#004966",
              "tertiary-container": "#146285",
              "tertiary-fixed": "#c5e7ff",
              "surface": "#f9f9ff",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#f0f3ff",
              "surface-container": "#e7eeff",
              "surface-container-high": "#dee8ff",
              "surface-container-highest": "#d8e3fb",
              "on-surface": "#111c2d",
              "on-surface-variant": "#40484e",
              "outline": "#70787f",
              "outline-variant": "#c0c7cf",
              "error": "#ba1a1a",
              "error-container": "#ffdad6"
            },
            fontFamily: {
              sans: ["'Plus Jakarta Sans'", "sans-serif"],
              mono: ["ui-monospace", "SFMono-Regular", "Menlo", "Monaco", "Consolas", "monospace"]
            }
          }
        }
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        vertical-align: middle;
      }
    </style>
  </head>
  <body class="bg-[#f9f9ff] text-[#111c2d] font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
